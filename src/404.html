<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden - Faris Ridžal</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#111111">
    <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg">
    <link rel="icon" type="image/png" href="/images/favicon/favicon-96x96.png" sizes="96x96">
    <!-- Absolute Pfade, weil diese Seite unter jeder beliebigen Adresse angezeigt wird -->
    <link rel="stylesheet" href="/styles.css">
    <style>
        .not-found {
            min-height: calc(100vh - 110px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background-color: #111;
        }

        .not-found-code {
            font-size: 120px;
            font-weight: 700;
            line-height: 1;
            color: #fff;
            letter-spacing: 4px;
        }

        .not-found h1 {
            font-size: 28px;
            margin: 20px 0 12px;
        }

        .not-found p {
            color: #aaa;
            margin-bottom: 30px;
        }

        @media (max-width: 480px) {
            .not-found-code {
                font-size: 80px;
            }

            .not-found h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="nav-container">
            <a href="/" class="logo">FARIS RIDŽAL</a>
        </div>
    </header>

    <main class="not-found">
        <div>
            <div class="not-found-code">404</div>
            <h1>Seite nicht gefunden</h1>
            <p>Diese Seite gibt es leider nicht. Vielleicht hat sich ein Tippfehler in die Adresse geschlichen.</p>
            <a href="/" class="btn">Zur Startseite</a>
        </div>
    </main>
</body>

</html>
